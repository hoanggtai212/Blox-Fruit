<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Sea Adventure</title>

<style>
*{box-sizing:border-box}
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#72c8ff;
    touch-action:none;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#63c7ff;
}

#world{
    position:absolute;
    width:3000px;
    height:1800px;
    background:
        radial-gradient(circle at 20% 30%,rgba(255,255,255,.35) 0 45px,transparent 46px),
        radial-gradient(circle at 70% 20%,rgba(255,255,255,.3) 0 60px,transparent 61px),
        #55bff0;
}

#island{
    position:absolute;
    left:350px;
    top:250px;
    width:2300px;
    height:1300px;
    border-radius:180px;
    background:#59bd4f;
    border:35px solid #d7b35c;
    box-shadow:inset 0 0 80px rgba(0,0,0,.15);
}

#island2{
    position:absolute;
    left:1050px;
    top:600px;
    width:800px;
    height:450px;
    border-radius:100px;
    background:#70cf58;
}

#title{
    position:absolute;
    top:80px;
    left:50%;
    transform:translateX(-50%);
    font-size:50px;
    font-weight:bold;
    color:white;
    text-shadow:4px 4px 0 #333;
}

#player{
    position:absolute;
    width:45px;
    height:60px;
    background:#2463d4;
    border-radius:12px;
    z-index:20;
    box-shadow:0 5px 0 rgba(0,0,0,.25);
}

#player:before{
    content:"";
    position:absolute;
    width:34px;
    height:34px;
    left:5px;
    top:-28px;
    border-radius:50%;
    background:#ffd3a3;
    border:3px solid #222;
}

.enemy{
    position:absolute;
    width:48px;
    height:62px;
    background:#d83b3b;
    border-radius:10px;
    z-index:10;
    transition:.15s;
}

.enemy:before{
    content:"";
    position:absolute;
    width:34px;
    height:34px;
    left:7px;
    top:-27px;
    border-radius:50%;
    background:#f0b58b;
    border:3px solid #222;
}

.enemy.dead{
    opacity:.2;
    transform:scale(.7);
}

.hpbox{
    position:absolute;
    width:75px;
    left:50%;
    top:-45px;
    transform:translateX(-50%);
    text-align:center;
}

.hpname{
    color:white;
    font-size:11px;
    font-weight:bold;
    text-shadow:1px 1px 2px #000;
}

.hpbg{
    height:8px;
    background:#222;
    border-radius:10px;
    overflow:hidden;
}

.hpfill{
    width:100%;
    height:100%;
    background:#27d34d;
}

#hud{
    position:fixed;
    left:12px;
    top:12px;
    padding:13px 17px;
    min-width:190px;
    background:rgba(0,0,0,.65);
    color:white;
    border-radius:14px;
    z-index:100;
    line-height:1.6;
}

#quest{
    position:fixed;
    top:12px;
    right:12px;
    padding:12px 16px;
    background:rgba(0,0,0,.65);
    color:white;
    border-radius:14px;
    z-index:100;
}

#attack{
    position:fixed;
    right:25px;
    bottom:25px;
    width:90px;
    height:90px;
    border:0;
    border-radius:50%;
    background:#ff9d19;
    color:white;
    font-weight:bold;
    font-size:15px;
    z-index:100;
    box-shadow:0 5px 0 #b96700;
}

#attack:active{
    transform:translateY(5px);
    box-shadow:none;
}

#skill{
    position:fixed;
    right:130px;
    bottom:30px;
    width:65px;
    height:65px;
    border:0;
    border-radius:50%;
    background:#8b45ff;
    color:white;
    font-weight:bold;
    z-index:100;
}

#joystick{
    position:fixed;
    left:20px;
    bottom:25px;
    width:145px;
    height:145px;
    z-index:100;
}

.jbtn{
    position:absolute;
    width:50px;
    height:50px;
    border:0;
    border-radius:12px;
    background:rgba(0,0,0,.6);
    color:white;
    font-size:22px;
}

#up{left:47px;top:0}
#down{left:47px;bottom:0}
#left{left:0;top:47px}
#right{right:0;top:47px}

#fruit{
    position:absolute;
    width:42px;
    height:42px;
    border-radius:50% 45% 50% 45%;
    background:#ff6b2c;
    border:4px solid #fff;
    z-index:15;
    box-shadow:0 0 20px #ff7b00;
}

#fruit:after{
    content:"🍃";
    position:absolute;
    right:-12px;
    top:-15px;
    font-size:20px;
}

#npc{
    position:absolute;
    width:55px;
    height:70px;
    background:#8c5a35;
    border-radius:12px;
    z-index:10;
}

#npc:before{
    content:"SHOP";
    position:absolute;
    top:-28px;
    width:100%;
    text-align:center;
    color:white;
    font-weight:bold;
    text-shadow:2px 2px #000;
}

#message{
    position:fixed;
    left:50%;
    bottom:140px;
    transform:translateX(-50%);
    padding:12px 20px;
    background:rgba(0,0,0,.75);
    color:white;
    border-radius:12px;
    z-index:200;
    opacity:0;
    transition:.3s;
}

#message.show{opacity:1}

#shop{
    display:none;
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:300px;
    padding:25px;
    background:#222;
    color:white;
    border-radius:18px;
    z-index:300;
    text-align:center;
}

#shop button{
    width:100%;
    margin:8px 0;
    padding:12px;
    border:0;
    border-radius:10px;
    font-weight:bold;
}

@media(max-width:600px){
    #title{font-size:30px}
    #hud{font-size:13px}
    #quest{font-size:12px}
}
</style>
</head>

<body>

<div id="game">

<div id="world">

<div id="island"></div>
<div id="island2"></div>

<div id="title">SEA ADVENTURE</div>

<div id="player"></div>

<div id="fruit" style="left:1500px;top:750px"></div>

<div id="npc" style="left:1750px;top:700px"></div>

<div class="enemy" style="left:900px;top:700px" data-hp="100">
<div class="hpbox">
<div class="hpname">Bandit</div>
<div class="hpbg"><div class="hpfill"></div></div>
</div>
</div>

<div class="enemy" style="left:1100px;top:850px" data-hp="100">
<div class="hpbox">
<div class="hpname">Bandit</div>
<div class="hpbg"><div class="hpfill"></div></div>
</div>
</div>

<div class="enemy" style="left:1350px;top:500px" data-hp="150">
<div class="hpbox">
<div class="hpname">Strong Bandit</div>
<div class="hpbg"><div class="hpfill"></div></div>
</div>
</div>

</div>

</div>

<div id="hud">
<b>⚔️ SEA ADVENTURE</b><br>
⭐ Level: <span id="level">1</span><br>
✨ EXP: <span id="exp">0</span> / 100<br>
💰 Beli: <span id="coins">100</span><br>
🍎 Power: <span id="power">None</span>
</div>

<div id="quest">
🎯 Quest<br>
Defeat Bandits<br>
<span id="kills">0</span> / 5
</div>

<button id="attack">ATTACK</button>
<button id="skill">SKILL<br>Z</button>

<div id="joystick">
<button class="jbtn" id="up">▲</button>
<button class="jbtn" id="left">◀</button>
<button class="jbtn" id="right">▶</button>
<button class="jbtn" id="down">▼</button>
</div>

<div id="message"></div>

<div id="shop">
<h2>🏪 Power Shop</h2>
<p>Flame Power</p>
<p>Giá: 500 Beli</p>
<button id="buy">Mua Power 🔥</button>
<button id="closeShop">Đóng</button>
</div>

<script>

let playerX=1200;
let playerY=850;

let level=1;
let exp=0;
let coins=100;
let power="None";
let kills=0;

const player=document.getElementById("player");
const world=document.getElementById("world");

const levelText=document.getElementById("level");
const expText=document.getElementById("exp");
const coinsText=document.getElementById("coins");
const powerText=document.getElementById("power");
const killsText=document.getElementById("kills");

const keys={};

document.addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()]=true;
});

document.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;
});

function updateHUD(){

    levelText.textContent=level;
    expText.textContent=exp;
    coinsText.textContent=coins;
    powerText.textContent=power;
    killsText.textContent=kills;

}

function message(text){

    const box=document.getElementById("message");

    box.textContent=text;
    box.classList.add("show");

    setTimeout(()=>{
        box.classList.remove("show");
    },1800);

}

function move(){

    let speed=5;

    if(keys["w"]||keys["arrowup"]) playerY-=speed;
    if(keys["s"]||keys["arrowdown"]) playerY+=speed;
    if(keys["a"]||keys["arrowleft"]) playerX-=speed;
    if(keys["d"]||keys["arrowright"]) playerX+=speed;

    playerX=Math.max(400,Math.min(2500,playerX));
    playerY=Math.max(300,Math.min(1450,playerY));

    player.style.left=playerX+"px";
    player.style.top=playerY+"px";

    camera();

}

function camera(){

    const x=window.innerWidth/2-playerX;
    const y=window.innerHeight/2-playerY;

    world.style.transform=
        `translate(${x}px,${y}px)`;

}

function gameLoop(){

    move();

    requestAnimationFrame(gameLoop);

}

gameLoop();


// ======================
// MOBILE CONTROL
// ======================

function hold(button,key){

    button.addEventListener("touchstart",e=>{
        e.preventDefault();
        keys[key]=true;
    });

    button.addEventListener("touchend",e=>{
        e.preventDefault();
        keys[key]=false;
    });

    button.addEventListener("mousedown",()=>{
        keys[key]=true;
    });

    button.addEventListener("mouseup",()=>{
        keys[key]=false;
    });

}

hold(document.getElementById("up"),"w");
hold(document.getElementById("down"),"s");
hold(document.getElementById("left"),"a");
hold(document.getElementById("right"),"d");


// ======================
// ENEMY
// ======================

const enemies=document.querySelectorAll(".enemy");

function distance(a,b){

    return Math.sqrt(
        Math.pow(a.x-b.x,2)+
        Math.pow(a.y-b.y,2)
    );

}

function getNearestEnemy(){

    let target=null;
    let shortest=170;

    enemies.forEach(enemy=>{

        let hp=Number(enemy.dataset.hp);

        if(hp<=0)return;

        let x=parseFloat(enemy.style.left);
        let y=parseFloat(enemy.style.top);

        let d=distance(
            {x:playerX,y:playerY},
            {x:x,y:y}
        );

        if(d<shortest){

            shortest=d;
            target=enemy;

        }

    });

    return target;

}

function attackEnemy(enemy){

    if(!enemy)return;

    let hp=Number(enemy.dataset.hp);

    let damage=10+level*2;

    hp-=damage;

    enemy.dataset.hp=hp;

    const fill=enemy.querySelector(".hpfill");

    const max=enemy.querySelector(".hpname").textContent==="Strong Bandit"
        ?150
        :100;

    fill.style.width=Math.max(0,hp/max*100)+"%";

    message("⚔️ -" + damage + " HP");

    if(hp<=0){

        enemy.classList.add("dead");

        coins+=25;
        exp+=30;
        kills++;

        message("👾 Bandit defeated! +30 EXP +25 Beli");

        if(exp>=100){

            exp-=100;
            level++;

            message("🎉 LEVEL UP! Level "+level);

        }

        updateHUD();

        setTimeout(()=>{

            enemy.dataset.hp=max;
            fill.style.width="100%";
            enemy.classList.remove("dead");

        },4000);

    }

}


// ATTACK

document.getElementById("attack").addEventListener("click",()=>{

    const enemy=getNearestEnemy();

    if(enemy){
        attackEnemy(enemy);
    }else{
        message("❌ Không có quái ở gần!");
    }

});


// ======================
// POWER
// ======================

document.getElementById("fruit").addEventListener("click",function(){

    if(power==="None"){

        power="Flame";

        this.style.display="none";

        message("🔥 Bạn đã nhận Flame Power!");

        updateHUD();

    }

});


// SKILL

document.getElementById("skill").addEventListener("click",()=>{

    if(power==="None"){

        message("🍎 Hãy tìm Power trước!");

        return;

    }

    const target=getNearestEnemy();

    if(!target){

        message("❌ Không có mục tiêu!");

        return;

    }

    let hp=Number(target.dataset.hp);

    hp-=35;

    target.dataset.hp=hp;

    const max=
        target.querySelector(".hpname").textContent==="Strong Bandit"
        ?150
        :100;

    target.querySelector(".hpfill").style.width=
        Math.max(0,hp/max*100)+"%";

    message("🔥 FLAME BLAST! -35 HP");

    if(hp<=0){

        target.classList.add("dead");

        coins+=40;
        exp+=50;
        kills++;

        if(exp>=100){

            exp-=100;
            level++;

            message("🎉 LEVEL UP! Level "+level);

        }

        updateHUD();

        setTimeout(()=>{

            target.dataset.hp=max;
            target.querySelector(".hpfill").style.width="100%";
            target.classList.remove("dead");

        },4000);

    }

});


// ======================
// SHOP
// ======================

document.getElementById("npc").addEventListener("click",()=>{

    document.getElementById("shop").style.display="block";

});

document.getElementById("closeShop").addEventListener("click",()=>{

    document.getElementById("shop").style.display="none";

});

document.getElementById("buy").addEventListener("click",()=>{

    if(coins<500){

        message("💰 Không đủ Beli!");

        return;

    }

    if(power!=="None"){

        message("🍎 Bạn đã có Power!");

        return;

    }

    coins-=500;
    power="Flame";

    document.getElementById("shop").style.display="none";

    message("🔥 Đã mua Flame Power!");

    updateHUD();

});


// ======================
// SAVE
// ======================

function save(){

    localStorage.setItem(
        "seaAdventure",
        JSON.stringify({
            level,
            exp,
            coins,
            power,
            kills
        })
    );

}

function load(){

    const data=localStorage.getItem("seaAdventure");

    if(!data)return;

    try{

        const saveData=JSON.parse(data);

        level=saveData.level||1;
        exp=saveData.exp||0;
        coins=saveData.coins||100;
        power=saveData.power||"None";
        kills=saveData.kills||0;

    }catch(e){}

    updateHUD();

}

setInterval(save,5000);

load();

updateHUD();

</script>

</body>
</html>
