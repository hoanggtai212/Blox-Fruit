<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sea Adventure</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="game">
        <div id="world">

            <div id="island">
                <div id="player"></div>

                <div class="enemy" id="enemy1">
                    <span>Bandit</span>
                    <div class="hp"><div></div></div>
                </div>

                <div class="enemy" id="enemy2">
                    <span>Bandit</span>
                    <div class="hp"><div></div></div>
                </div>

                <div id="fruit">🍎</div>
                <div id="npc">🧑‍💼</div>

            </div>
        </div>

        <div id="hud">
            <b>⚔️ SEA ADVENTURE</b>
            <div>⭐ Level: <span id="level">1</span></div>
            <div>✨ EXP: <span id="exp">0</span>/100</div>
            <div>💰 Beli: <span id="beli">100</span></div>
            <div>🍎 Power: <span id="power">None</span></div>
        </div>

        <div id="quest">
            🎯 Quest<br>
            Defeat Bandits<br>
            <span id="kills">0</span>/5
        </div>

        <div id="controls">
            <button id="up">▲</button>
            <button id="left">◀</button>
            <button id="down">▼</button>
            <button id="right">▶</button>
        </div>

        <div id="actions">
            <button id="attack">⚔️</button>
            <button id="skill">🔥</button>
        </div>

        <div id="message"></div>
    </div>

    <script src="game.js"></script>
</body>
</html>
