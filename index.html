<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Sea Adventure 3D</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game"></div>

  <div id="hud">
    <div class="title">⚔️ SEA ADVENTURE</div>
    <div>⭐ Level: <b id="level">1</b></div>
    <div>✨ EXP: <b id="exp">0</b>/100</div>
    <div>💰 Beli: <b id="beli">100</b></div>
    <div>🍎 Power: <b id="power">None</b></div>
  </div>

  <div id="quest">
    <b>🎯 Quest</b>
    <div id="questText">Đánh bại 3 Bandits</div>
    <div><b id="kills">0</b>/3</div>
  </div>

  <div id="help">💻 WASD di chuyển · Chuột xoay camera · Space nhảy · Click đánh</div>

  <div id="message"></div>

  <div id="mobile">
    <div id="stick">
      <button data-key="w" class="up">▲</button>
      <button data-key="a" class="left">◀</button>
      <button data-key="s" class="down">▼</button>
      <button data-key="d" class="right">▶</button>
    </div>
    <div id="mobileActions">
      <button id="mJump">⬆</button>
      <button id="mAttack">⚔️</button>
      <button id="mSkill">🔥</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
  <script src="game.js"></script>
  <script src="mobile.js"></script>
</body>
</html>
