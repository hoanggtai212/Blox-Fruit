<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fruit Adventure</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #87ceeb;
        }

        #game {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background:
                linear-gradient(#72c7ff 0%, #b9e8ff 65%, #4caf50 65%);
        }

        /* Mặt đất */
        #ground {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 35%;
            background: #4caf50;
        }

        /* Nhân vật */
        #player {
            position: absolute;
            width: 45px;
            height: 65px;
            left: 50%;
            bottom: 35%;
            transform: translateX(-50%);
            background: #2563eb;
            border-radius: 12px 12px 8px 8px;
            z-index: 10;
        }

        #player::before {
            content: "";
            position: absolute;
            width: 35px;
            height: 35px;
            background: #ffd7a8;
            border-radius: 50%;
            top: -28px;
            left: 5px;
        }

        /* Enemy */
        .enemy {
            position: absolute;
            width: 45px;
            height: 60px;
            background: #dc2626;
            border-radius: 10px;
            bottom: 35%;
        }

        /* Thanh thông tin */
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            padding: 12px 18px;
            color: white;
            background: rgba(0, 0, 0, 0.55);
            border-radius: 12px;
            z-index: 20;
            line-height: 1.6;
        }

        /* Nút */
        #attackButton {
            position: absolute;
            right: 20px;
            bottom: 25px;
            width: 90px;
            height: 90px;
            border: none;
            border-radius: 50%;
            background: #f59e0b;
            color: white;
            font-weight: bold;
            font-size: 16px;
            z-index: 20;
        }

        #attackButton:active {
            transform: scale(0.92);
        }
    </style>
</head>

<body>

<div id="game">

    <div id="ground"></div>

    <div id="hud">
        Level: <span id="level">1</span><br>
        EXP: <span id="exp">0</span> / 100<br>
        Coins: <span id="coins">100</span>
    </div>

    <div id="player"></div>

    <div class="enemy" style="left: 25%;"></div>
    <div class="enemy" style="left: 70%;"></div>

    <button id="attackButton">ATTACK</button>

</div>

<script>
    let level = 1;
    let exp = 0;
    let coins = 100;

    const levelText = document.getElementById("level");
    const expText = document.getElementById("exp");
    const coinsText = document.getElementById("coins");

    function updateHUD() {
        levelText.textContent = level;
        expText.textContent = exp;
        coinsText.textContent = coins;
    }

    document.getElementById("attackButton").addEventListener("click", function () {

        exp += 20;

        if (exp >= 100) {
            exp -= 100;
            level++;

            alert("LEVEL UP! Bạn đã lên Level " + level);
        }

        updateHUD();
    });

    updateHUD();
</script>
<script src="game.js"></script>
</body>
</html>
